*url_index.headers {postdata=channelColumnCode=020000&channelSearchValue=}
*end_scope
*scope.range {(postback)|end}
*url_index.modify {set|https://www.tivibu.com.tr/Channel/GetChannelColumn}
*end_scope
*scope.range {(channellist)|end}
*index_site_id.scrub {multi|"channelListViewModel":[|"channelCode":"ch|.png","channelImageAltText"|]}
*index_site_channel.scrub {multi|"channelListViewModel":[|"channelName":"|"|]}
*index_site_id.modify {replace(type=regex)|"^\d+(.*\/)"|##}
*index_site_channel.modify {cleanup(style=unidecode)}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
*end_scope
