site {url=tivibu.com.tr|timezone=Asia/Istanbul|maxdays=7.1|cultureinfo=tr-TR|charset=UTF-8|titlematchfactor=90}
site {ratingsystem=TR|episodesystem=onscreen|grabengine=playwright.browser.normal|unlock=false}
site {grabengine=playwright.api}
*https://www.tivibu.com.tr/canli-tv
scope.range {(urlindex)|end}
url_index {url|https://www.tivibu.com.tr/canli-tv}
url_index.headers {method=POST_BACK(GET,POST)}
url_index.headers{contenttype=application/x-www-form-urlencoded; charset=UTF-8}
url_index.headers {postdata=channelCode=ch'global_temp_3'&channelDateBegin='urldate'+00%3A00%3A00&channelDateEnd='global_temp_2'%3A59%3A59}
url_index.headers {customheader=x-requested-with=XMLHttpRequest}
url_index.headers {customheader=Requestverificationtoken='global_temp_9'}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
*
global_temp_9.scrub {single|name="CSRF-TOKEN-TVBUDNBX!-FORM" value="||"|"}
*
global_temp_1.modify {calculate(format=F0)|'config_timespan_days'}
global_temp_2.modify {calculate(format=date,yyyy.MM.dd)|'urldate' 'global_temp_1':0:0 +}
*
global_temp_3.modify {substring(type=regex)|'config_site_id' "^\d+"}
global_temp_4.modify {substring(type=regex)|'config_site_id' "\d+$"}
*
urldate.format {datestring|yyyy.MM.dd}
end_scope
*
scope.range {(postback)|end}
url_index.modify {set|https://www.tivibu.com.tr/Channel/GetPrevueList}
end_scope
*
index_urlchannellogo.modify {set(scope=datelogo)|https://itv224186.tmp.tivibu.com.tr:6430/images/poster/'global_temp_4'.png}
*
scope.range {(splitindex)|end}
index_showsplit.scrub {multi|"mobilPrevueViewModel":[||]|]}
index_showsplit.modify {replace(type=regex)|"\!\?\?\!"|-}
index_showsplit.modify {replace|\},\{"prevueName"|\}\|\{"prevueName"}
index_showsplit.modify {cleanup(style=unidecode)}
index_showsplit.modify {cleanup(style=jsondecode)}
*index_showsplit.modify {(debug)}
end_scope
*
scope.range {(indexshowdetails)|end}
index_start.scrub {regex||"beginTime":"(\d{4}\.\d{2}\.\d{2}\s\d{2}:\d{2}):\d{2}"||}
index_stop.scrub {regex||"endTime":"(\d{4}\.\d{2}\.\d{2}\s\d{2}:\d{2}):\d{2}"||}
index_title.scrub {single|"prevueName":"||","|","}
index_description.scrub {single|"description":"||","|","}
index_category.scrub {single|"genre":"||"|"}
index_showicon.scrub {single|"prevueImage":"||"|"}
index_rating.scrub {single|"ratingId":"||"|"}
*
index_rating.modify {replace|generalAudience|0+}
index_rating.modify {replace|plus7|7+}
index_rating.modify {replace|plus13|13+}
index_rating.modify {replace|plus18|18+}
end_scope
