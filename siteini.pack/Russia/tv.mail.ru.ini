site {url=tv.mail.ru|timezone=UTC|maxdays=8|cultureinfo=ru-RU|charset=UTF-8|titlematchfactor=90|allowlastdayoverflow}
site {ratingsystem=RU}
site {grabengine=playwright.browser.noblock}
*
scope.range{(urlindex)|end}
url_index{url|https://tv.mail.ru/ajax/service/channels/schedule/?region_id=70&date=|urldate|&channel_id=|channel|}
url_index.headers {customheader=Accept-Encoding=gzip,deflate}
url_index.headers {accept=application/json, text/javascript, */*; q=0.01}
url_index.headers {customheader=authority=tv.mail.ru}
urldate.format {datestring|yyyy-MM-dd}
end_scope
*
index_urlchannellogo.modify {addend('global_temp_1' not "")|https://resizer.mail.ru/p/'global_temp_1'}
global_temp_1.scrub {{regex||"logo_picture":\{"uuid":"([^"]*","key":"[^"]*)","||}
index_urlchannellogo.modify {replace('global_temp_1' not "")|","key":"|/dpr:200/}
global_temp_2.scrub {regex||"params":\{"dpr":\[200\],"scale":true\},"fmt":\["([^"]*)"\],"||}
index_urlchannellogo.modify {addend('global_temp_2' not "")|.'global_temp_2'}

*
index_showsplit.scrub {multi|"events":[||],"form_data"|],"form_data"}
index_showsplit.modify {replace|\},\{|\}\|\{}
index_showsplit.modify {cleanup(style=jsondecode)}
**index_showsplit.modify {(debug)}
*
index_temp_1.scrub {single|"id":"||"|"}
index_urlshow {url|https://tv.mail.ru|"url":"||",|",}
index_urlshow.headers {customheader=Accept-Encoding=gzip, deflate, br, zstd}
index_urlshow.headers {authority=tv.mail.ru}
*
index_start.scrub {single|"start_ts":||,"|,"}
index_stop.scrub {single|"stop_ts":||,"|",}
index_title.scrub {single()|"name":"||","|","}
index_titleoriginal.scrub {single(lang=en)|"name_eng":"||",|",}
index_starrating.scrub {regex||"rate_score":"(\d+\.\d+)",||}
index_rating.scrub {single|"age_restrict":"||",|",}
index_productiondate.scrub {single|"year":{"name":"||",|",}
index_temp_2.scrub {regex||"name":".*?\((\d+ сезон)\)\|\((Сезон \d+-й)\).*?","||} 
index_temp_3.scrub {regex||"name":".*?\((\d+-я серия)\).*?","||} 
index_temp_4.scrub {regex||"name":".*?\((\d+-я часть)\).*?","||} 
index_episode.modify {addstart(pattern="'S1' сезон 'E1'-я серия 'P1'-я часть""'S1' сезон 'E1'-я серия""'E1'-я серия""'S1' сезон""Сезон 'S1'")|'index_temp_2' 'index_temp_3'}
index_episode.modify {addend ('temp_4' not "")| 'index_temp_4'}
index_title.modify {remove(type=regex)|"name":".*?(\(\d+-я часть\))\|(\(\d+-я серия\))\|(\(\d+ сезон\))\|(\(Сезон \d+-й\)).*?","}
**
title.modify {addend|'index_title'}
subtitle.scrub {regex||\"episode_title\"\:\"(.+?)\",\"||}
subtitle.scrub {single(null separator=":" exclude=first)|"mrc_title":|"«|»|","} 
description.scrub{single('index_description' "")|<div class="ba25837e39 f9cbc7a035">||</div></div>|</div></div>}
description.modify {cleanup(tags="<"">")}
director.scrub {multi(separator="," max=3)|">Режиссер</h2>||</a></div></div>|</a></div></div>}
director.modify {cleanup(tags="<"">")}
actor.scrub {multi(separator="," max=10)|class="c09f4f7dca b211cccf77" rel="">В ролях</a></h2>||</div></div>|</div></div></div>}
actor.modify {cleanup(tags="<"">")}
presenter.scrub {multi(separator="," max=3)|Ведущие</span>||</div></div></div>|</div></div></div>}
presenter.modify {cleanup(tags="<"">")}
producer.scrub {multi(separator="," max=3)|"EventAttrsTitle_Продюсеры">Продюсеры</h2>||</div></div>|</div></div>}
producer.modify {cleanup(tags="<"">")}
writer.scrub {multi(separator="," max=3)|data-qa="EventAttrsTitle_Сценарий">Сценарий</h2>||</div></div>|</div></div>}
writer.modify {cleanup(tags="<"">")}
composer.scrub {multi(separator="," max=3)|data-qa="EventAttrsTitle_Композитор">Композитор</span>||</div></div>|</div></div>}
composer.modify {cleanup(tags="<"">")}
rating.scrub {single|"age_restrict":||,|,}
category.scrub {multi(max=3)|<div data-qa="Text" class="a0ad36e382 d91597d529">||</div>|</div>}
starrating.scrub {single|<span class="d5da557a9d c38b2d9a24">||</span>|</div>}
country.scrub {multi(max=3)|<a href=|data-qa="Link" class="c09f4f7dca aa6dbbff08" rel="">|</a>|</a>}
showicon.scrub {single(include=first)|"thumbnailUrl":["||","|]}
*
title.modify {cleanup(style=jsondecode)}
subtitle.modify {cleanup(style=jsondecode)}
description.modify {cleanup(tags="<"">")}
description.modify {cleanup(style=jsondecode)}
