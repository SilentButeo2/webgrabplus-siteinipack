* @header_end
**------------------------------------------------------------------------------------------------
site {url=sportdigital.de|timezone=Europe/Berlin|maxdays=21.1|cultureinfo=de-DE|charset=UTF-8|nopageoverlaps|titlematchfactor=90}
site {episodesystem=onscreen}
*
url_index {url|https://start.sportdigital.de/tvprogramm/|channel|}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
*
urldate.format {datestring|yyyy-MM-dd}
*
index_urlchannellogo {single|<div class="col-6 col-md-4 col-lg-3 mx-auto">|<img src="|" class=|" class=}
*
scope.range {(splitindex)|end}
index_showsplit.scrub {multi|<section class="epgTag|<div class="epgSendung||</section>}
index_temp_9.modify {substring(type=regex)|'index_showsplit' "<span class=\"epgUhr\"><time datetime=\"([^\+]*)\+\d{2}:\d{2}\">"} 
index_temp_9.modify {cleanup(removeduplicates link="index_showsplit")}
*index_showsplit.modify {(debug)}
end_scope

index_start.scrub {regex||<span class="epgUhr"><time datetime="([^\+]*)\+\d{2}:\d{2}\">||}
index_stop.scrub {regex||<span class="epgBis"> – <time datetime="([^\+]*)\+\d{2}:\d{2}\">||}
index_title.scrub {single|<h3 class="epgTitel">||</h3>|</h3>}
index_title.modify {cleanup(tags="<"">")}
index_description.scrub {single|<p class="epgInfo">||</p>|</p>}
index_description.scrub {single|<p>||</p>|</p>}
index_category.scrub {single|<p class="epgZusatz">||</p>|</p>}
index_category.modify {remove(type=regex)|^.*?(\(.*?\))$}
index_showicon.scrub {single|"image":[|"|"|]}
index_temp_1.scrub {regex||<span class="epgKennzeichen">(LIVE\|TIPP)</span>||}
*
index_temp_1.modify {cleanup(style=name)}
index_title.modify {addstart('index_temp_1' not "")|'index_temp_1': }
