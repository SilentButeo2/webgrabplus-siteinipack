site {url=prisma.de|timezone=Europe/Berlin|maxdays=7|cultureinfo=de-DE|charset=UTF-8|titlematchfactor=90|ratingsystem=DE|allowlastdayoverflow}
*site {episodesystem=xmltv_ns}
site {grabengine=playwright.browser.noblock}

*
url_index {url|https://www.prisma.de/tv-programm/programm-nach-sendern/|channel|/d/|urldate|#program}
url_index.headers {customheader=Accept-Encoding=gzip,deflate}
urldate.format {datestring|yyyy-MM-dd} 
index_showsplit.scrub {multi()|<div class="accordion">|<div class="card10  ">|<span class="label label--line"></span>|</div></div></div></div></div></div></section>}
**index_showsplit.modify {(debug)}
**********
index_start.scrub {single|<div class="card10__hour">||</div>|</div>}
index_title.scrub {single|<h3>||</h3>|</h3>}
index_title.modify {cleanup(tags="<"">")}
index_category.scrub {multi|<div class="card10__genre">||</div>|</div>}
*
index_urlshow {url|https://www.prisma.de|<h3>|<a href="|"|">}
index_urlshow.headers {customheader=Accept-Encoding=gzip,deflate}
*
title.scrub {single|<div class="program-detail-title__title">||</div>|</div>}
titleoriginal.scrub {single(lang=en)|Originaltitel              </div>|<div class="kino-details__info">|</div>|</div>}
subtitle.scrub {single|<div class="kino-details-titles__sub">||</div>|</div>}
description.scrub {single()|<div class="wysiwyg">||</p>|</div>} 
description.modify {cleanup(tags="<"">")}
showicon.scrub {single|<!-- Preload LCP images -->|href="|"|>}

director.scrub {multi|Regie</div>|<p>|</p>|</div>}
actor.scrub {multi|<h2 class="section__title">Darsteller</h2>|<div class="card3__title">|</div>|</slider2>}
actor.scrub {multi(max=10)|<div class="section__title-small mt__1 mb__1">Weitere Darsteller</div>|<span property="name" class="label label--disabled">|</span>|</section>}
writer.scrub {multi|Drehbuch</div>|<p>|</p>|</div>}
composer.scrub {multi|Musik</div>|<p>|</p>|</div>}
rating.scrub {single|Altersfreigabe              </div>|<div class="kino-details__info">|</div>|</div>}
category.scrub {multi(separator=",")|<div class="program-detail-title__genre">||</div>|</div>}
productiondate.scrub {single|Produktionsdatum              </div>|<div class="kino-details__info">|</div>|</div>}
country.scrub {single(separator=",")|Produktionsland              </div>|<div class="kino-details__info">|</div>|</div>}
starrating.scrub {single|<div class="rating-desc l" title="||">|">}
episode.scrub {single(pattern="Folge 'E1',")|<div class="article-text">|<small>|</small>|</div>}
*
titleoriginal.modify {clear('title')}
description.modify {cleanup(tags="<"">")}
description.modify {cleanup}
actor.modify {cleanup(tags="<"">")}
director.modify {cleanup(tags="<"">")}
writer.modify {cleanup(tags="<"">")}
composer.modify {cleanup(tags="<"">")
