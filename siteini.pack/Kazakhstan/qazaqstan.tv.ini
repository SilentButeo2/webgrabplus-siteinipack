**------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: qazaqstan.tv
* @MinSWversion: V5.0
* @Revision 1 - [03/09/2026] kevev
*  - creation
* @Remarks:
*   Single channel. Livewire app; schedule also embedded as unicode-escaped JSON
*   in the wire:snapshot attribute on <main> - not usable, rendered DOM is used.
*   The currently-airing show on today's page is a <div class="...activenow">,
*   not an <a class="...program-item">, and uses different time/title/genre
*   classes. All three scrubs are deliberately loose to match both. Do not
*   tighten them, or that show is silently dropped.
*   No stop times published; stop derives from the next show's start.
*   Broadcast day runs 06:05 to 05:50 next morning - allowlastdayoverflow.
*   Site publishes today + 3 days only, so maxdays=4 is the ceiling.
*   site_id is not used - url_index has no channel component.
* @header_end
**------------------------------------------------------------------------------------------------
site {url=qazaqstan.tv|timezone=Asia/Almaty|maxdays=4|cultureinfo=kk-KZ|charset=utf-8|titlematchfactor=90|allowlastdayoverflow|timeout=30}
site {ratingsystem=KZ|langoverrule=kk}
scope.range {(urlindex)|end}
url_index {url|https://qazaqstan.tv/program/|urldate}
urldate.format {datestring|yyyy-MM-dd}
index_urlchannellogo {addstart|https://upload.wikimedia.org/wikipedia/commons/4/46/QAZAQSTAN_TV_LOGO.png}
end_scope
*
index_showsplit.scrub {multi|w-full grid|||</section>}
index_showsplit.modify {substring(type=regex)|<a href="[^"]*"\s*class="w-full program-item.*?</a>}
scope.range {(indexshowdetails)|end}
index_start.scrub {regex||font-bold text-h[^"]*">(\d{2}:\d{2})<||}
*
index_title.scrub {single|program-title|>|</div>|</div>}
index_title.modify {cleanup}
*
index_category.scrub {regex||text-xs lg:text-base">(.*?)</div>||}
index_category.modify {cleanup}
index_showicon.scrub {regex||<img\s*src="([^"]*)"\s*srcset||}
index_urlshow {url(exclude="#")||<a href="||"|"}
end_scope
title.modify {addstart|'index_title'}
description.scrub {single|<meta name="description" content="||">|">}
description.modify {cleanup}
*
**  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _
