**------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: ukradiolive.com
* @MinSWversion: V5.0
* @Revision 0 - [06/10/2026] kevev
*  - creation
* @Remarks: site_id is the station name from the site url, e.g. talkradio for ukradiolive.com/talkradio
*  the channel list holds all UK stations of the site, not every station publishes a schedule
* @header_end
**------------------------------------------------------------------------------------------------
site {url=ukradiolive.com|timezone=Europe/London|maxdays=7.1|cultureinfo=en-GB|charset=utf-8|titlematchfactor=90}
*
scope.range {(urlindex)|end}
url_index {url|https://ukradiolive.com/|channel|/schedule}
url_index.headers {referer=https://ukradiolive.com/}
url_index.headers {customheader=origin=https://ukradiolive.com}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
*
urldate.format {daycounter|0}
end_scope
*
index_urlchannellogo {url(scope=datelogo)||<div class="schedule-col-head">|data-lazy-load="|"|</div>}
*
scope.range {(splitindex)|end}
index_showsplit.scrub {regex||<div itemscope itemtype="https?://schema.org/BroadcastEvent" class="schedule-program-row".*?<div class="line1"></div>||}
index_showsplit.modify {replace(type=regex)|"\!\?\?\!"|-}
index_temp_1.modify {substring(type=regex)|'index_showsplit' itemprop=\"startDate\" content=\"([^\"]*)"}
index_temp_1.modify {cleanup(removeduplicates keeplast link="index_showsplit")}
end_scope
*
scope.range {(indexshowdetails)|end}
index_start.scrub {single(separator="+" include=first)|itemprop="startDate" content="||"|"}
index_title.scrub {single|<span itemprop="name">||<|<}
index_description.scrub {regex||<div class="schedule-program-descr anim"[^>]*>(.*?)</div>||}
*
index_description.modify {cleanup(tags="<span class=\"more-dott\">""</span>")}
index_description.modify {cleanup(tags="<span class=\"more-link\" role=\"button\">""</span>")}
index_description.modify {cleanup(tags="<"">")}
index_category.modify {set|Radio}
end_scope
**  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _
**      #####  CHANNEL FILE CREATION (only to create the xxx-channel.xml file)
**
** @auto_xml_channel_start
*scope.range {(urlindex)|end}
*url_index {url|https://ukradiolive.com/get-radio-list}
*url_index.headers {method=POST}
*url_index.headers {postdata=ord=0&actP='subpage'&type=&cat=0}
*url_index.headers {customheader=x-requested-with=XMLHttpRequest}
*subpage.format {list(format=F0 step=1 count=9)|1}
*end_scope
*scope.range {(channellist)|end}
*index_site_id.scrub {|}
*index_temp_9.scrub {multi(separator="},{" include="en_GB")|"list":[{||}]},"morePFake"|}]},"morePFake"}
*index_temp_9.modify {cleanup(style=unidecode)}
*index_temp_9.modify {cleanup(style=jsondecode)}
*index_site_id.modify {substring(type=regex)|'index_temp_9' "\"r_urlname\":\"([^\"#]*)"}
*index_site_channel.modify {substring(type=regex)|'index_temp_9' "\"r_name\":\"([^\"]*)\","}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
*end_scope
** @auto_xml_channel_end