site {url=satelitnatv.sk|timezone=Europe/Bratislava|maxdays=5|cultureinfo=sk-SK|charset=UTF-8|titlematchfactor=90|firstshow=1|episodesystem=onscreen}
*
site {grabengine=playwright.browser.noblock}
urldate.format {datestring|yyyy-MM-dd}
scope.range{(urlindex)|end}
url_index{url|https://www.satelitnatv.sk/tv-program/|channel|/?mtvp_submitted=1&mtvp_channel_order=&mtvp_date=|urldate|&mtvp_slot=morning&mtvp_display=full&mtvp_layout=cards&mtvp_q=}
url_index.headers {customheader=Accept-Encoding=gzip,deflate}
end_scope
*
index_showsplit.scrub {multi|<section class="mtvp__card">|<article class="mtvp__program|</article>|</section>}
index_temp_9.modify {substring(type=regex)|'index_showsplit' "data-mtvp-src-id=\"(.*?)\""}
index_temp_9.modify {cleanup(removeduplicates link="index_showsplit")}
**index_showsplit.modify {(debug)}
*
index_urlchannellogo {url|https://www.satelitnatv.sk|<img class="mtvp__logo" src="||"|"}
*
scope.range{(indexshowdetails)|end}
index_start.scrub {single|<strong class="mtvp__time-start">||</strong>|</strong>}
index_stop.scrub {single|<span class="mtvp__time-end">||</span>|</span>}
index_title.scrub {single|data-mtvp-program-title="||"|"}
index_description.scrub {single|<div class="mtvp__long">||</div>|</div>}
index_temp_1.scrub{single|data-mtvp-program-description="||"|"}
index_description.modify {addend('description' "")|'index_temp_1'}
index_description.modify {cleanup(tags="<"">")} 
index_premiere.scrub {regex||<span class="mtvp__badge mtvp__badge--premiere">(Premiéra)</span>||}
index_premiere.modify {replace|Premiéra|true}
index_premiere.modify {addend|(lang=null)}
index_rating.scrub {single|<span class="mtvp__badge mtvp__badge--age">||</span>|</span>}
index_productiondate.scrub {single|<span class="mtvp__program-year">|(|)|</span>}
index_category.scrub {multi(include="Seriál""Film")|<span class="mtvp__badge mtvp__badge--|">|</span>|</span>}
index_category.modify {cleanup(tags="<"">")} 
end_scope
