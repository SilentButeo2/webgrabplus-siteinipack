**------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: cignalplay.com
* @MinSWversion: V5.0
* @Revision 3 - [11/10/2026] kevev
*  - new api host and client, full-day windows, showsplit and channel list rewrite
* @Revision 2 - [30/04/2024] Blackbear199
*  - fix for some missing channels
*  - urlindex fix
* @Revision 1 - [29/04/2024] Blackbear199
*  - rewrite
* @Revision 0 - [01/05/2019] Blackbear199
*  - creation
* @Remarks: site_id is the channel id (uuid), see cignalplay.com.channels.xml
*  some channels publish only "To Be Announced" placeholders and return no shows
* @header_end
**------------------------------------------------------------------------------------------------
site {url=cignalplay.com|timezone=UTC|maxdays=7|cultureinfo=en-PH|charset=UTF-8|titlematchfactor=90|keepindexpage|allowlastdayoverflow}
site {ratingsystem=PH|episodesystem=onscreen}
*
url_index {url|https://data-store-cdn.api.pldtcms.quickplay.com/content/epg?start=|urldate|T00:00:00.000Z&end=|urldate|T23:59:59.999Z&reg=ph&dt=web&client=pldt-plive-web&pageNumber=1&pageSize=100}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
*
urldate.format {datestring|yyyy-MM-dd}
*
scope.range {(urlindex)|end}
global_temp_1.modify {set|'config_site_id'}
end_scope
*
*index_urlchannellogo.modify {set|https://qp-pldt-image-resizer-cloud-prod.akamaized.net/image/'global_temp_1'/0-16x9.jpg?height=150}
*
index_showsplit.scrub {regex||\{"ch":\{[^\}]*\},"cid":"'global_temp_1'"(?:(?!"ut":")(?!"pgm_id":"to-be-announced").)*"ut":"[^"]*"\}||}
scope.range {(splitindex)|end}
index_showsplit.modify {cleanup(style=jsondecode)}
index_temp_1.modify {substring(type=regex)|'index_showsplit' "\"sc_st_dt\":\"([^\"]*)"}
index_temp_1.modify {cleanup(removeduplicates link="index_showsplit")}
*index_showsplit.modify {(debug)}
end_scope
*
index_start.scrub {single|"sc_st_dt":"||Z|Z}
index_stop.scrub {single|"sc_ed_dt":"||Z|Z}
index_title.scrub {single|"lon":[|"n":"|"}|]}
index_description.scrub {single|"lod":[|"n":"|"}|]}
index_title.modify {replace| \\n| }
index_title.modify {replace|\\n| }
index_description.modify {replace| \\n| }
index_description.modify {replace|\\n| }
**  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _
**      #####  CHANNEL FILE CREATION (only to create the xxx-channel.xml file)
**
** @auto_xml_channel_start
*index_site_id.scrub {regex||\],"cid":"([^"]*)","cs":"[^"]*","lon":\[\{"lang":"en","n":"[^"]*"||}
*index_site_channel.scrub {regex||\],"cid":"[^"]*","cs":"[^"]*","lon":\[\{"lang":"en","n":"([^"]*)"||}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
** @auto_xml_channel_end
