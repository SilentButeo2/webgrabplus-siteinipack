site {url=watch.sportsnet.ca|timezone=UTC|maxdays=7|cultureinfo=en-CA|charset=UTF-8|titlematchfactor=90|allowlastdayoverflow}
site {ratingsystem=CA|episodesystem=onscreen}
*
scope.range {(urlindex)|end}
url_index {url()|https://production-cdn.d3-rgr-diva.com/api/schedules?channels=|channel|&date=|urldate|&device=web_browser&duration=24&ff=idp%2Cldp%2Crpt%2Crgrs%2Ccd%2Cdpl&hour=22&intersect=true&lang=en}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
end_scope
*
urldate.format {datestring|yyyy-MM-dd}
*
scope.range {(splitindex)|end}
index_showsplit.scrub {multi|"schedules":[||]|]}
index_showsplit.modify {replace(type=regex)|"\!\"\"\!"|/}
index_showsplit.modify {replace|\},\{|\}\|\{}
index_temp_9.modify {substring( type=regex)|'index_showsplit' "\"startDate\":\"(.*?)Z"} 
index_temp_9.modify {cleanup(removeduplicates link="index_showsplit")}
index_showsplit.modify {cleanup(style=unidecode)}
index_showsplit.modify {cleanup(style=jsondecode)}
*index_showsplit.modify {(debug)}
end_scope
*
index_start.scrub {regex||"startDate":"([^Z]*)Z"||}
*index_stop.scrub {regex||"endDate":"([^Z]*)Z"||}
index_title.scrub {single|"title":"||",|",}
index_description.scrub {single|"tagline":"||"}|"}}
index_description.scrub {single|"shortDescription":"||",|",}
index_category.scrub {single(separator="","")|"sports":["||"]|"]}
index_rating.scrub {single|"classification":{|"name":"|"|}}
index_showicon.scrub {single|"images":{|"wallpaper":"|"|}}
*
index_category.modify {cleanup(style=name)}
index_category.modify {addend|\|Sports}
