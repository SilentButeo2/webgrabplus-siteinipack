*------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: emcitv.com
* @MinSWversion: v5.0
* @Revision 0 - [2026-08-20] kevev
*   - Innitial release.
* @Remarks:   Change timezone if needed
*  
* @header_end
*------------------------------------------------------------------------------------------------
site {url=emcitv.com|timezone=Europe/Paris|maxdays=7|cultureinfo=fr-FR|charset=utf-8|titlematchfactor=90|allowlastdayoverflow|timeout=30}
url_index {url|https://www.emcitv.com/programmes/|urldate|}
urldate.format {datestring|yyyy-MM-dd}
index_urlchannellogo.modify {set|https://www.emcitv.com/app/common/assets/img/logo/LOGO-emci-2.png}
index_showsplit.scrub {multi|<div class="slot-line "|||<footer id="footer"}
index_showsplit.modify {substring(type=regex)|data-slot=".*?class="title" title="[^"]*"}
index_start.scrub {regex||data-slot="\d+-\d{4}-\d{2}-\d{2}\s+(\d{2}:\d{2})||}
index_start.modify {clean}
index_title.scrub {regex||class="sticker sticker-blue">(.*?)</div>||}
index_title.modify {clean}
index_subtitle.scrub {regex||class="title" title="([^"]*)"||}
index_subtitle.modify {clean}
index_showicon.scrub {regex||class="thumb-img" src="([^"]+)"||}
index_showicon.modify {clean}
**      #####  CHANNEL FILE CREATION (only to create the xxx-channel.xml file)
**
** @auto_xml_channel_start
*index_site_id.scrub {|}
*index_site_id.modify {set|emcitv.com}
*index_site_channel.modify {set|Emci TV}
** @auto_xml_channel_end