**------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: tvtv.ca
* @MinSWversion: V5.6.0
* @Revision 9 - [18/08/2026] Mat8861
* @Revision 8 - [22/06/2026] jhr1948
* @Revision 7 - [09/09/2025] Blackbear199
*   - update
*   - channel creation improvement
* @Revision 6 - [27/10/2023] Blackbear199
*   - site changes
* @Revision 5 - [28/01/2023] Blackbear199
*   - site changes
* @Revision 4 - [14/01/2022] Blackbear199
*   - site changes
* @Revision 3 - [23/01/2020] Blackbear199
*   - channel.xml fix
* @Revision 2 - [12/09/2019] Blackbear199
*  - remove duplicates(showsplit)
* @Revision 1 - [28/08/2019] Blackbear199
*   - url_index change
* @Revision 0 - [14/08/2018] Blackbear199
*   - creation
* @Remarks: very slow
* 1. Replace the site_id="xx" with the postal code.
*    Example L9H1N3
*    <update>c1-L9H1N3</update>
*    <channel update="i" site="tvtv.ca" site_id="L9H1N3" xmltv_id="dummy">dummy</channel>
* 2. Use a channel line created in step 1.
*    <update>c2-L9H1N3-bell-fibre</update>
*    <channel update="i" site="tvtv.ca" site_id="CAN-0005980-X" xmltv_id="Bell Fibe TV - Toronto/Niagara/Barrie">Bell Fibe TV - Toronto/Niagara/Barrie</channel>
* @header_end
**------------------------------------------------------------------------------------------------
site {url=tvtv.ca|timezone=UTC|maxdays=5|cultureinfo=en-CA|charset=UTF-8|episodesystem=onscreen|ratingsystem=CA}
site {grabengine=playwright.browser.noblock}
site {retry=<retry time-out="10" channel-delay="1" index-delay="1" show-delay="4">4</retry>}
*site {unlock=false}

scope.range {(urlindex)|end}
urldate.format {datestring|yyyy-MM-dd}
global_temp_1.modify {calculate(format=date,yyyy-MM-dd)|'urldate'}
index_variable_element.modify {set(format=date,yyyy-MM-ddTHH:mm:ss)|'global_temp_1'T00:00:00}
global_temp_2.modify {calculate(format=date,java)|'index_variable_element'}
url_index.modify {replace()|##Date##|'global_temp_2'}
global_temp_3.modify {substring(type=regex)|'config_site_id' ".*?##(.*)"}
url_index.modify {replace|##channel##|'global_temp_3'}
url_index{url()|https://tvtv.ca/partial/source/##Date##/##channel##}
url_index.headers {customheader=Accept-Encoding=gzip,deflate}
url_index.headers {customheader=hx-request= true}
end_scope
**
scope.range {(splitindex)|end}
index_showsplit.scrub {regex||<div class="gridAiring.*?<\/div>||}
index_showsplit.modify {cleanup(style=jsondecode)}
index_temp_9.modify {substring(type=regex)|'index_showsplit' "data-time=\"\d+\""} 
index_temp_9.modify {cleanup(removeduplicates link="index_showsplit")}
**index_showsplit.modify {(debug)}
end_scope
**
scope.range {(indexshowdetails)|end}
index_title.scrub {regex||<div class="gridAiring[^>]*>([^<]*)<||}
index_title.modify {cleanup(tags="<"">")} 
index_temp_1.scrub {regex||">([^"]*?)<span class="gridSubtitle">[^"]*?<\/div>||}
index_temp_5.scrub {regex||--runtime:\d+;">([^"]*?)<\/div>||}
index_temp_6.scrub {regex||data-qualifiers="[^"]*?">([^"]*?)<\/div>||}
index_start.scrub {single|data-time="||"|"}
index_title.modify {addstart('index_title' "")|'index_temp_1''index_temp_5''index_temp_6'}
index_title.modify {cleanup}
index_subtitle.scrub {single|<span class="gridSubtitle">||</span>|</span>}
index_subtitle.modify {cleanup}
index_productiondate.scrub {single|<span class="gridSubtitle">||</span>|</span>}
index_category.scrub {regex||<span class="gridSubtitle">\s*\(\d{4},\s([^\)]*)\)||}
index_temp_2.scrub {single()|data-id="||"|"}
index_temp_3.scrub {regex()||data-qualifiers=".*?(Live).*?">||}
index_temp_3.modify {replace|Live|true}
index_temp_4.scrub {regex()||data-qualifiers=".*?(New).*?">||}
index_temp_4.modify {replace|New|true}
index_premiere.modify {addstart ()|'index_temp_4''index_temp_3'}
index_premiere.modify {addend|(lang=null)}
index_subtitle.modify {remove|'index_productiondate'}
index_subtitle.modify {remove|'index_category'}
index_subtitle.modify {remove(type=regex)|\(\s+?,?\s+\)}
index_urlshow.modify {addstart ('index_temp_2' not "")|https://tvtv.ca/dlg/program?id='index_temp_2'}
index_urlshow.headers {customheader=Accept-Encoding=gzip,deflate}
index_urlshow.headers {customheader=hx-request=true}
index_urlshow.headers {customheader=hx-target=programdlg}
index_urlshow.headers {authority=tvtv.ca}
end_scope

scope.range {(showdetails)|end}
title.scrub {single()|<fieldset|<h1>|</h1>|</h1>}
title.modify {addstart("")|'index_title'}
description.scrub {single()|<p id="program-qualifiers"></p>|<p>|</p>|</p>}
rating.scrub {single()|<p id="program-qualifiers"></p>|<div class="iUKhPqiV">|</div>|</div>} * only overall rating, site has more
episode.scrub {regex(pattern="Season'S1'; Episode'E1'")||<p>(Season\s+\d+\;\s+Episode\s+\d+)||}
showicon.scrub {url()|https://tvtv.ca|<body><img src="||"|"}
presenter.scrub {regex()||<h2>\s*([^<]+?)\s*\(Narrator\)||}
producer.scrub {regex()||<h2>\s*([^<]+?)\s*\(.*?Producer\)||}
director.scrub {regex()||<h2>\s*([^<]+?)\s*\(Creator\)||}
director.scrub {regex()||<h2>\s*([^<]+?)\s*\(Director\)||}
writer.scrub {regex()||<h2>\s*([^<]+?)\s*\(Writer\)||}
composer.scrub {regex()||<h2>\s*([^<]+?)\s*\(.*?Music\)||}
actor.scrub {regex()||<h2>\s*([^<]+?)\s*\(Actor\)||}
actor.scrub {multi()|<h2>Cast</h2>|<h2>|</h2>|</div><div></div><h2>Crew}
actor.modify {remove(type=regex)|\s\(Actor\)}
actor.modify {replace( type=regex)|"(\s\().+?\)\z"| (role=}
actor.modify {cleanup}
end_scope
