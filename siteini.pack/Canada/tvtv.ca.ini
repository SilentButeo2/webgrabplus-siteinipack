**      ##### CITY FILE CREATION (only to create the xxx-channel.xml file)
**
** @auto_xml_channel_start
*scope.range {(urlindex)|end}
*url_index {url|https://tvtv.ca/partial/search?q=|channel|}
*url_index.headers {method=POST_BACK(GET,GET)}
*global_temp_1.scrub {multi()|<a href="||">|">}
*end_scope
*scope.range {(postback)|end}
*subpage.format {list|'global_temp_1'}
*url_index.modify {set|https://tvtv.ca'subpage'}
*end_scope
*scope.range {(channellist)|end}
*index_site_id.scrub {regex()||<a href="\/([^"]*)">[^<]*<div class="[^"]*">[^<]*<\/div>||}
*index_site_channel.scrub {regex()||<a href="\/[^"]*">([^<]*<div class="[^"]*">[^<]*)<\/div>||}
*index_site_channel.modify {replace(type=regex)|<div class="[^"]*">| - }
*index_site_channel.modify{cleanup(style=unidecode)}
*index_site_channel.modify{cleanup(style=jsondecode)}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
*end_scope
** @auto_xml_channel_end

**  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _  _
**      #####  CHANNEL FILE CREATION (only to create the xxx-channel.xml file)
**
** @auto_xml_channel_start
*scope.range {(urlindex)|end}
*url_index {url|https://tvtv.ca/on/|channel|}
*end_scope
*scope.range {(channellist)|end}
*index_site_id.scrub {regex()||<a class="WGWowhoY" data-id="(\d+)" data-ch="\d+" href="\.\/[^"]*">||}
*index_site_channel.scrub {regex()||<a class="WGWowhoY" data-id="\d+" data-ch="\d+" href="\.\/.*?stn\d+\-(\d+\-[^"]*)">||}
*index_site_channel.modify {replace|-| - }
*index_site_id.modify {replace(type=regex)|"^\d+(.*\"\/)"|##}
*index_site_id.modify {addstart|'config_site_id'##}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
*end_scope
** @auto_xml_channel_end