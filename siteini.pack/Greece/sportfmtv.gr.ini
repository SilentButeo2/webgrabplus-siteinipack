* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: sportfmtv.gr
* @MinSWversion: V5.0
* @Revision 0 - [06/10/2026] kevev
*  - creation
* @Remarks: site_id is the channel id (uuid) from the channel list.
*  SPORT FM TV 3 carries live matches only and is empty on most days.
* @header_end
**------------------------------------------------------------------------------------------------
site {url=sportfmtv.gr|timezone=UTC|maxdays=7|cultureinfo=el-GR|charset=UTF-8|titlematchfactor=90|allowlastdayoverflow}
*
url_index {url|https://vh33zrthcffldaeiaea5snvuem.appsync-api.eu-central-1.amazonaws.com/graphql}
url_index.headers {method=POST}
url_index.headers {contenttype=application/json}
url_index.headers {postdata={"query":"{listPublicProgramGuide(tenant_id:\"VENUE_PAO\",window_from:\"'urldate'T00:00:00.000Z\",window_to:\"'urldate'T23:59:59.999Z\",channel_id:\"'global_temp_1'\",limit:200){channel_id channel_title channel_image_url title description image_url broadcast_start end_time air_state}}","variables":{}}}
url_index.headers {customheader=x-api-key=da2-ida73mk7drfhzi67dyh76odb6a}
*
scope.range {(urlindex)|end}
global_temp_1.modify {set|'config_site_id'}
end_scope
*
urldate.format {datestring|yyyy-MM-dd}
*
index_urlchannellogo.scrub {regex||^.*?"channel_image_url":"([^"]*)"||}
*
index_showsplit.scrub {regex||\{"channel_id":"[^\{\}]*?"broadcast_start":"[^\{\}]*\}||}
scope.range {(splitindex)|end}
index_showsplit.modify {replace(type=regex)|"\!\?\?\!"|-}
index_showsplit.modify {cleanup(style=jsondecode)}
end_scope
*
index_start.scrub {regex||"broadcast_start":"([^".]*)||}
index_stop.scrub {regex||"end_time":"([^".]*)||}
index_title.scrub {regex||"title":"([^"]*)"||}
index_description.scrub {regex||"description":"([^"]*)"||}
index_showicon.scrub {regex||"image_url":"([^"]*)"||}
