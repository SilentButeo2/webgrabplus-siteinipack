*index_site_channel.scrub {regex()||\{"id":"[^"]*","title":"([^"]*)","guid":"[^"]*","callSign":"","category"||}
*index_site_id.scrub      {regex()||\{"id":"([^"]*)","title":"[^"]*","guid":"[^"]*","callSign":"","category"||}
