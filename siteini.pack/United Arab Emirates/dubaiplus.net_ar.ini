site {url=dubaiplus.net_ar|timezone=Asia/Dubai|maxdays=4.1|cultureinfo=en-GB|charset=UTF-8|titlematchfactor=90|keepindexpage}
*site {episodesystem=xmltv_ns}
scope.range{(urlindex)|end}
urldate.format {datestring|yyyy-MM-dd}
global_temp_1.modify {calculate(format=date,yyyy-MM-dd)|'urldate'}
global_temp_3.modify {calculate(format=date,java)|'global_temp_1'}
global_temp_2.modify {calculate(format=date,yyyy-MM-dd)|'urldate' 4:0:0 +}
global_temp_5.modify {calculate(format=date,java)|'global_temp_2'}
url_index.modify {replace|##start_date##|'global_temp_3'}
url_index.modify {replace|##end_date##|'global_temp_5'}
global_temp_4.modify{set|'config_site_id'}
url_index.headers {customheader=Accept-Encoding=gzip,deflate,br}
url_index{url|https://d1vr1mlm6fadud.cloudfront.net/content/channels?locationId=309639718595&language=ar-AE&byListingTime=##start_date##~##end_date##&offsetTime=-19800000&origin=mpx&size=40&region=AE&maxParentalRatings=18&platform=web}
end_scope
index_showsplit.scrub {regex||\{"id":"'global_temp_4'","title":"[^"]*","guid":"[^"]*","callSign":"","category".*?"originalTitle":"[^"]*","presentationType":"[^"]*"}||}
index_showsplit.modify {cleanup(style=jsondecode)}
index_showsplit.modify{substring(type=regex)|"\{"id":"[^"]*","startTime":\d+,"endTime":\d+.*?"originalTitle":"[^"]*"\}\}"}
**index_showsplit.modify {(debug)}
index_start.scrub {regex||"startTime":(\d+),"endTime":\d+,"||}
*index_stop.scrub {regex||"startTime":\d+,"endTime":(\d+),"||}
index_title.scrub {regex||"pId":"[^"]*","programType":"[^"]*","originalTitle":"([^"]*)","||} 
index_description.scrub {single|"descriptionLocalized":{"ar":"|",|",}
index_temp_1.scrub {single|"title":"|","description":"|",|",}
index_description.modify{addend('index_description' "")|'index_temp_1'}
index_urlchannellogo {url||"thumbnail":{"url":"||",|",}
index_showicon.scrub {single|"image":[{"width"|"url":"|",|}}
