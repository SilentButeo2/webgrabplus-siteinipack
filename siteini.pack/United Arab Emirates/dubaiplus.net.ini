**------------------------------------------------------------------------------------------------
* @header_start
* WebGrab+Plus ini for grabbing EPG data from TvGuide websites
* @Site: dubaiplus.net
* @MinSWversion: V5.5
* @Revision 0 - [28/09/2026] kevev
*   - creation
* @Remarks:
* site_id is the numeric channel id, e.g. 702096936061 = Dubai
* radio channels have no EPG
* xmltv_ids must not be prefixes of one another or WG++ misplaces channel logos
* @header_end
**------------------------------------------------------------------------------------------------
site {url=dubaiplus.net|timezone=UTC|maxdays=4|cultureinfo=en-US|charset=UTF-8|titlematchfactor=90|allowlastdayoverflow}
site {episodesystem=onscreen}
url_index {url|https://d1vr1mlm6fadud.cloudfront.net/content/channels/##channel##?region=US&platform=web&language=en-US&byListingTime=##start_date##000~##end_date##999}
url_index.headers {customheader=Accept-Encoding=gzip,deflate}
url_index.modify           {replace|##channel##|'config_site_id'}
index_urlchannellogo.scrub {regex||^.*?"transparentThumbnail":\{[^\}]*?"url":"([^"]*)"||}
*
scope.range                {(urlindex)|end}
global_temp_9.modify       {calculate(format=date,zzz)|'now'}
global_temp_8.modify       {substring(type=char)|'global_temp_9' 0 1}
global_temp_9.modify       {remove(type=char)|0 1}
global_temp_7.modify       {calculate(format=date,unix)|'now'}
global_temp_6.modify       {calculate(format=F0)|'urldate_formatted'}
global_temp_6.modify       {calculate(format=F0)|86400 *}
global_temp_7.modify       {calculate(format=F0)|'global_temp_6' +}
global_temp_3.modify       {calculate('global_temp_8' "-" format=date,unix)|'global_temp_7' 0:'global_temp_9' +}
global_temp_3.modify       {calculate('global_temp_8' "+" format=date,unix)|'global_temp_7' 0:'global_temp_9' -}
global_temp_4.modify       {calculate(format=F0)|'global_temp_3' 86399 +}
url_index.modify           {replace|##start_date##|'global_temp_3'}
url_index.modify           {replace|##end_date##|'global_temp_4'}
end_scope
*
urldate.format {daycounter|0}
*
index_showsplit.scrub {regex||\{"id":"\d+","startTime":.*?"\}\}(?=[,\]][\{,])||}
index_showsplit.modify {cleanup(style=jsondecode)}
*
index_start.scrub {regex||"startTime":(\d{10})||}
*index_stop.scrub {regex||"endTime":(\d{10})||}
index_title.scrub {regex||"program":\{"id":"\d+","title":"(.*?)","description"||}
index_description.scrub {regex||"description":"(.*?)","descriptionLocalized"||}
index_description.modify {replace|\\t| }
index_showicon.scrub {regex||"image":\[\{[^\}]*?"url":"((?![^"]*/images/channels/)[^"]*)"||}
index_temp_1.scrub {regex||"program":\{"id":"\d+","title":"[^"]*?\bSeason\s+([1-9]\d*)||}
index_episode.scrub {regex(pattern="S'S1'E'E1'""S'S1'""E'E1'")||"program":\{"id":"\d+","title":"[^"]*?\b[Ee]p(?:isode)?\s+([1-9]\d*)\b||}
index_episode.modify {addstart(not "")|E}
index_episode.modify {addstart('index_temp_1' not "")|S'index_temp_1'}
*
** @auto_xml_channel_start
*scope.range {(urlindex)|end}
*url_index {url|https://d1vr1mlm6fadud.cloudfront.net/content/channels?region=US&platform=web&language=en-US&size=100&byListingTime=##now##000~##now##999}
*global_temp_1.modify {calculate(format=date,unix)|'now'}
*url_index.modify {replace|##now##|'global_temp_1'}
*end_scope
*scope.range {(channellist)|end}
*index_site_id.scrub {regex||\{"id":"(\d+)","title":"[^"]*","guid":||}
*index_site_channel.scrub {regex||\{"id":"\d+","title":"([^"]*)","guid":||}
*index_site_channel.modify {replace(type=regex)|"Dubai Racing(?! \d)"|Dubai Racing 1}
*index_site_id.modify {cleanup(removeduplicates link="index_site_channel")}
*end_scope
** @auto_xml_channel_end
